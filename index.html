<!DOCTYPE html>
<!--
  Daris Cleaning — single-file production website.
  Code map:  CONFIG → i18n → THEME → ROUTER → ANIMATIONS → FORM
  Server rewrite (so every /{lang}/… path serves this file):
    • Apache (.htaccess):  RewriteEngine On
                           RewriteCond %{REQUEST_FILENAME} !-f
                           RewriteCond %{REQUEST_FILENAME} !-d
                           RewriteRule . /index.html [L]
    • Nginx:               location / { try_files $uri $uri/ /index.html; }
    • Netlify (_redirects):  /*  /index.html  200
    • Vercel (vercel.json):  { "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }] }
  If no rewrite is available the router automatically falls back to hash URLs.
-->

<!-- No-flash theme: set before first paint -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('daris-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<style>
/* ============================= THEME TOKENS ============================= */
:root{
  --offwhite:#F7F5F0; --ink:#14201F; --teal:#0E5C5A; --aqua:#5CC8C0; --sand:#E9E4D8;
  --accent:#E8705F;
  --bg:var(--offwhite); --text:var(--ink); --muted:#53605E;
  --surface:#FFFFFF; --surface-2:#FBFAF6; --border:rgba(20,32,31,.12);
  --brand:var(--teal); --brand-ink:#0B4746;
  --shadow-sm:0 1px 2px rgba(20,32,31,.05), 0 2px 8px rgba(20,32,31,.05);
  --shadow-md:0 8px 30px rgba(20,32,31,.10);
  --glass:rgba(255,255,255,.65); --glass-brd:rgba(255,255,255,.7);
  --maxw:1240px;
}
[data-theme="dark"]{
  --bg:#0C1413; --text:#E8F1EF; --muted:#9FB3AF; --brand:#3FB5AD; --brand-ink:#9BE7E0;
  --surface:#142120; --surface-2:#172A28; --border:rgba(232,241,239,.14);
  --sand:#1C2B29;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.35);
  --shadow-md:0 10px 36px rgba(0,0,0,.45);
  --glass:rgba(20,33,32,.55); --glass-brd:rgba(90,120,117,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Inter Tight",system-ui,sans-serif; line-height:1.6;
  font-size:clamp(16px,1vw + .7rem,18px);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif; font-weight:600; line-height:1.04; letter-spacing:-.01em; color:var(--text); margin:0;}
h1{font-size:clamp(2.6rem,6vw,5.2rem)}
h2{font-size:clamp(2rem,4vw,3.3rem)}
h3{font-size:clamp(1.3rem,2vw,1.7rem)}
p{margin:0 0 1rem} a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:clamp(20px,5vw,56px)}
.eyebrow{font-family:"Inter Tight";text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;font-weight:600;color:var(--brand)}
.lead{font-size:clamp(1.05rem,1.4vw,1.25rem);color:var(--muted);max-width:52ch}
.section{padding-block:clamp(64px,9vw,128px)}
.hyph{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:6px}
.skip{position:fixed;left:-999px;top:10px;z-index:200;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px}
.skip:focus{left:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* ============================= BUTTONS ============================= */
.btn{display:inline-flex;align-items:center;gap:.55em;font-weight:600;font-size:1rem;
  padding:.85em 1.4em;border-radius:999px;border:1px solid transparent;cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.7,.3,1),background .25s,color .25s,box-shadow .25s;
  min-height:48px;will-change:transform;background:none}
.btn .arr{transition:transform .3s ease}
.btn:hover .arr{transform:translateX(4px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{box-shadow:0 10px 26px rgba(14,92,90,.35)}
[data-theme="dark"] .btn-primary{color:#07100f}
.btn-ghost{border-color:var(--border);color:var(--text);background:var(--surface)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.5em .9em;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);font-size:.85rem;font-weight:500;box-shadow:var(--shadow-sm)}
.chip svg{width:16px;height:16px;color:var(--brand)}

/* ============================= HEADER ============================= */
header.site{position:fixed;top:0;left:0;right:0;z-index:100;transition:transform .4s cubic-bezier(.2,.7,.3,1),background .3s,border-color .3s;
  border-bottom:1px solid transparent}
header.site.scrolled{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
header.site.hide{transform:translateY(-110%)}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:74px}
.nav-links{display:flex;align-items:center;gap:.4rem}
.nav-links a{padding:.55em .9em;border-radius:999px;font-weight:500;font-size:.95rem;color:var(--muted);transition:color .2s,background .2s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.nav-right{display:flex;align-items:center;gap:.5rem}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:.5em .7em;font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.seg button.active{background:var(--brand);color:#fff}
[data-theme="dark"] .seg button.active{color:#07100f}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--text);transition:border-color .2s,transform .3s}
.icon-btn:hover{border-color:var(--brand)}
.icon-btn svg{width:20px;height:20px}
.burger{display:none}
.logo{display:flex;align-items:center;gap:.6rem;color:var(--text)}
.logo svg{height:40px;width:auto}

/* mobile menu overlay */
.menu-overlay{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;
  padding:96px clamp(24px,8vw,64px) 40px;transform:translateY(-100%);transition:transform .5s cubic-bezier(.76,0,.24,1);visibility:hidden}
.menu-overlay.open{transform:translateY(0);visibility:visible}
.menu-overlay a{font-family:"Fraunces";font-size:clamp(2rem,9vw,3.2rem);padding:.25em 0;border-bottom:1px solid var(--border);color:var(--text)}
.menu-overlay a.active{color:var(--brand)}

/* ============================= HERO ============================= */
.hero{position:relative;padding-top:120px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);align-items:center}
.hero-copy h1 .line{display:block;overflow:hidden}
.hero-copy h1 .line > span{display:block;will-change:transform}
.hero-copy .lead{margin:1.4rem 0 2rem}
.hero-cta{display:flex;gap:.8rem;flex-wrap:wrap}
.trust-chips{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:2.2rem}
.hero-art{position:relative}
.hero-shape{position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;border:1px solid var(--border);
  box-shadow:var(--shadow-md);background:linear-gradient(160deg,var(--sand),var(--surface))}
.hero-shape img{width:100%;height:100%;object-fit:cover}
.hero-canvas{position:absolute;inset:0;pointer-events:none;z-index:1}
.hero-float{position:absolute;right:-18px;bottom:-22px;width:min(42%,190px);z-index:3;filter:drop-shadow(0 12px 24px rgba(20,32,31,.25))}
.hero-badge{position:absolute;left:-16px;top:28px;z-index:3;background:var(--glass);backdrop-filter:blur(10px);
  border:1px solid var(--glass-brd);border-radius:16px;padding:.7rem 1rem;box-shadow:var(--shadow-md);display:flex;gap:.6rem;align-items:center}
.hero-badge b{font-family:"Fraunces";font-size:1.1rem}
.hero-badge small{color:var(--muted);display:block;font-size:.75rem}

/* ============================= SERVICES ACCORDION ============================= */
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:2rem;flex-wrap:wrap;margin-bottom:clamp(32px,5vw,64px)}
.acc{border-top:1px solid var(--border)}
.acc-item{border-bottom:1px solid var(--border)}
.acc-btn{width:100%;display:flex;align-items:center;gap:1rem;background:none;border:0;cursor:pointer;
  padding:clamp(18px,2.4vw,28px) 4px;font:inherit;color:var(--text);text-align:left;transition:color .25s,padding-left .25s}
.acc-btn:hover{padding-left:12px;color:var(--brand)}
.acc-num{font-family:"Fraunces";color:var(--muted);font-size:.9rem;width:2.4em;flex:none}
.acc-ico{width:34px;height:34px;flex:none;color:var(--brand)}
.acc-ico svg{width:100%;height:100%}
.acc-name{font-family:"Fraunces";font-size:clamp(1.25rem,2.4vw,1.9rem);flex:1}
.acc-chev{flex:none;width:26px;height:26px;color:var(--muted);transition:transform .35s ease,color .25s}
.acc-item[aria-expanded="true"] .acc-chev{transform:rotate(180deg);color:var(--brand)}
.acc-item[aria-expanded="true"] .acc-name{color:var(--brand)}
.acc-panel{overflow:hidden;height:0}
.acc-panel-inner{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,44px);
  padding:0 4px clamp(28px,3.5vw,44px) calc(2.4em + 34px + 2rem);align-items:center}
.acc-panel-inner .copy p{color:var(--muted)}
.acc-panel-inner .copy .btn{margin-top:.4rem}
.acc-img{aspect-ratio:16/11;border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);background:var(--surface-2)}
.acc-img img,.acc-img svg{width:100%;height:100%;object-fit:cover;display:block}

/* ============================= HOW IT WORKS ============================= */
.how{background:var(--surface-2);border-block:1px solid var(--border);overflow:hidden}
.how-pin{position:relative}
.how-track{display:flex;gap:clamp(24px,4vw,60px)}
.step{flex:0 0 clamp(280px,42vw,460px);background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:clamp(28px,3vw,44px);box-shadow:var(--shadow-sm);position:relative}
.step .n{font-family:"Fraunces";font-size:3.4rem;color:var(--brand);opacity:.25;line-height:1}
.step h3{margin:.4rem 0 .6rem}.step p{color:var(--muted);margin:0}
.step .sico{position:absolute;top:28px;right:28px;width:30px;height:30px;color:var(--brand)}

/* ============================= SERVICE AREA ============================= */
.area-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);align-items:center}
.towns{list-style:none;padding:0;margin:1.5rem 0 0;display:flex;flex-wrap:wrap;gap:.6rem}
.towns li{font-family:"Fraunces";font-size:clamp(1.1rem,2vw,1.5rem);padding:.3em .8em;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.towns li.all{background:var(--brand);color:#fff;border-color:var(--brand)}
[data-theme="dark"] .towns li.all{color:#07100f}
.map-wrap{aspect-ratio:1/1;border-radius:24px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm);padding:18px}
.map-wrap svg{width:100%;height:100%}

/* ============================= FAQ ============================= */
.faq-item{border-bottom:1px solid var(--border)}
.faq-q{width:100%;display:flex;justify-content:space-between;gap:1rem;align-items:center;background:none;border:0;cursor:pointer;
  font:inherit;font-family:"Fraunces";font-size:clamp(1.05rem,1.8vw,1.35rem);color:var(--text);text-align:left;padding:1.1rem 2px}
.faq-q .pm{flex:none;width:24px;height:24px;color:var(--brand);transition:transform .35s}
.faq-item[aria-expanded="true"] .pm{transform:rotate(45deg)}
.faq-a{overflow:hidden;height:0}
.faq-a p{color:var(--muted);padding:0 2px 1.2rem;margin:0;max-width:70ch}

/* ============================= CONTACT ============================= */
.contact-band{background:var(--brand);color:#fff;border-radius:28px;padding:clamp(32px,4vw,56px);position:relative;overflow:hidden}
[data-theme="dark"] .contact-band{color:#eafffb}
.contact-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2rem}
.ccard{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-brd);border-radius:18px;padding:1.3rem;color:var(--ink);
  display:flex;flex-direction:column;gap:.4rem;transition:transform .3s}
[data-theme="dark"] .ccard{color:var(--text)}
.ccard:hover{transform:translateY(-4px)}
.ccard .ci{width:34px;height:34px;color:var(--teal)}
[data-theme="dark"] .ccard .ci{color:var(--aqua)}
.ccard b{font-family:"Fraunces";font-size:1.15rem}
.ccard span{font-size:.95rem;word-break:break-word}
.copybtn{margin-top:.3rem;align-self:flex-start;font-size:.8rem;border:1px solid var(--border);background:transparent;color:inherit;border-radius:999px;padding:.3em .7em;cursor:pointer}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.field{display:flex;flex-direction:column;gap:.4rem}
.field.full{grid-column:1/-1}
.field label{font-size:.85rem;font-weight:600}
.field input,.field select,.field textarea{font:inherit;padding:.85em 1em;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:48px;transition:border-color .2s}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);outline:none}
.field .err{color:var(--accent);font-size:.8rem;min-height:1em}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.form-note{color:var(--muted);font-size:.85rem}
.form-ok{background:color-mix(in srgb,var(--brand) 12%,transparent);border:1px solid var(--brand);border-radius:16px;padding:1.4rem;color:var(--text)}

/* ============================= FOOTER ============================= */
footer.site{background:var(--surface-2);border-top:1px solid var(--border);padding-block:clamp(48px,6vw,80px) 2rem}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2rem}
.foot-grid h4{font-family:"Inter Tight";text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--muted);margin-bottom:1rem}
.foot-grid a{display:block;color:var(--muted);padding:.25em 0;transition:color .2s}
.foot-grid a:hover{color:var(--brand)}
.foot-social{display:flex;gap:.6rem;margin-top:1rem}
.foot-bottom{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem}

/* ============================= MOBILE ACTION BAR ============================= */
.mobar{position:fixed;left:0;right:0;bottom:0;z-index:95;display:none;background:var(--glass);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:.5rem;padding-bottom:max(.5rem,env(safe-area-inset-bottom));gap:.5rem}
.mobar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.4rem;border-radius:12px;font-size:.72rem;font-weight:600;color:var(--text);min-height:48px;justify-content:center}
.mobar a svg{width:20px;height:20px;color:var(--brand)}
.mobar a.prime{background:var(--brand);color:#fff}
[data-theme="dark"] .mobar a.prime{color:#07100f}
.mobar a.prime svg{color:#fff}

/* ============================= COOKIE ============================= */
.cookie{position:fixed;left:16px;right:16px;bottom:16px;z-index:120;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-md);padding:1.1rem 1.2rem;display:none}
.cookie.show{display:block}
.cookie p{font-size:.85rem;color:var(--muted);margin:0 0 .8rem}
.cookie .row{display:flex;gap:.6rem}

/* ============================= CURSOR ============================= */
.cursor{position:fixed;top:0;left:0;width:34px;height:34px;border:1.5px solid var(--brand);border-radius:999px;pointer-events:none;z-index:300;transform:translate(-50%,-50%);transition:width .25s,height .25s,background .25s,opacity .25s;mix-blend-mode:normal;opacity:0}
.cursor.hover{width:56px;height:56px;background:color-mix(in srgb,var(--brand) 14%,transparent)}

/* ============================= PAGE HEADERS (sub-pages) ============================= */
.page-hero{padding-top:140px}
.breadcrumb{color:var(--muted);font-size:.85rem;margin-bottom:1rem}
.breadcrumb a:hover{color:var(--brand)}
.svc-detail{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,56px);align-items:center;margin-top:2rem}
.svc-detail .big-img{aspect-ratio:4/3;border-radius:24px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-md);background:var(--surface-2)}
.svc-detail .big-img img,.svc-detail .big-img svg{width:100%;height:100%;object-fit:cover}
.svc-list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin-top:2.5rem}
.svc-mini{border:1px solid var(--border);border-radius:16px;padding:1.1rem;background:var(--surface);transition:transform .3s,border-color .3s}
.svc-mini:hover{transform:translateY(-4px);border-color:var(--brand)}
.svc-mini .acc-ico{width:28px;height:28px;margin-bottom:.6rem}
.svc-mini b{font-family:"Fraunces";font-size:1.1rem;display:block}
.svc-mini small{color:var(--muted)}
.services-page{max-width:1500px}
.service-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(18px,2vw,28px);margin-top:clamp(32px,4vw,56px)}
.service-card{min-width:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:20px;background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .3s,border-color .3s,box-shadow .3s}
.service-card:hover{transform:translateY(-4px);border-color:var(--brand);box-shadow:var(--shadow-md)}
.service-card-image{aspect-ratio:16/10;overflow:hidden;background:var(--surface-2)}
.service-card-image img,.service-card-image svg{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.service-card:hover .service-card-image img{transform:scale(1.035)}

/* =======================================================================
   ROUTER (History API + hash fallback)
   ======================================================================= */
let USE_HASH=false;
// Decide routing mode: try pushState clean URLs; fallback to hash if file://
try{ if(location.protocol==="file:") USE_HASH=true; }catch(e){ USE_HASH=true; }

function parsePath(){
  let path;
  if(USE_HASH){ path=(location.hash||"#/").replace(/^#/,""); }
  else {
    path=location.pathname;
    if(location.hash && location.hash.length>2){ path=location.hash.replace(/^#/,""); } // allow hash links too
  }
  const parts=path.split("/").filter(Boolean);
  let lang=LANG, idx=0;
  if(LANGS.includes(parts[0])){ lang=parts[0]; idx=1; }
  const route=parts[idx]||"";
  const urlSlug=parts[idx+1]||"";
  const slug=route==="services"&&urlSlug ? serviceKeyFromUrlSlug(urlSlug,lang) : urlSlug;
  return {lang,route,slug};
}
function serviceUrlSlug(slug,lang=LANG){
  const title=SVC_COPY[lang]?.[slug]?.[0];
  if(!title) return slug;
  return title.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
    .replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function serviceKeyFromUrlSlug(urlSlug,lang=LANG){
  return SERVICES.find(s=>serviceUrlSlug(s.slug,lang)===urlSlug)?.slug
    || SERVICES.find(s=>LANGS.some(l=>serviceUrlSlug(s.slug,l)===urlSlug))?.slug
    || urlSlug;
}
function buildPath(route,slug){
  let p="/"+LANG+"/"+(route||"");
  if(route==="services"&&slug) p+="/"+serviceUrlSlug(slug,LANG);
  return p.replace(/\/+$/,"/")!==p?p:p;
}
function hrefFor(route,slug){
  const urlSlug=route==="services"&&slug ? serviceUrlSlug(slug,LANG) : slug;
  const p="/"+LANG+(route?("/"+route):"/")+(urlSlug?("/"+urlSlug):"");
  return USE_HASH?("#"+p):p;
}

function navigate(path, push=true){
  const parts=path.split("/").filter(Boolean);
  let idx=0; if(LANGS.includes(parts[0])){ setLangQuiet(parts[0]); idx=1; }
  const route=parts[idx]||""; const urlSlug=parts[idx+1]||"";
  const slug=route==="services"&&urlSlug ? serviceKeyFromUrlSlug(urlSlug,LANG) : urlSlug;
  const full=buildPath(route,slug);
  if(push){ if(USE_HASH){ location.hash=full; } else { history.pushState({}, "", full); } }
  renderRoute(route,slug);
}
function setLangQuiet(l){ if(LANGS.includes(l)){ LANG=l; document.documentElement.lang=l; try{localStorage.setItem("daris-lang",l);}catch(e){}
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("active",b.dataset.lang===l)); applyStaticI18n(); buildFooterChrome(); } }

function setActiveNav(route){
  document.querySelectorAll("[data-route]").forEach(a=>{ if(a.hasAttribute("data-link")) a.classList.toggle("active", (a.dataset.route||"")===route); });
  // update link hrefs to current lang
  document.querySelectorAll("a[data-link]").forEach(a=>{ a.setAttribute("href", hrefFor(a.dataset.route||"", a.dataset.serviceSlug||"")); });
}
function updateMeta(route,slug){
  const base=CONFIG.domain;
  const pathForLang=lang=>route?("/"+route+(slug?"/"+(route==="services"?serviceUrlSlug(slug,lang):slug):"")):"/";
  const seg=pathForLang(LANG);
  let title="Daris Cleaning", desc=t("hero.lead");
  if(route===""){ title=(LANG==="fi"?"Daris Cleaning — Puhtaat tilat ilman murheita":LANG==="sv"?"Daris Cleaning — Rena utrymmen utan bekymmer":"Daris Cleaning — Spotless spaces, zero worries"); }
  else if(route==="services" && !slug){ title=t("nav.services")+" — Daris Cleaning"; desc=t("services.lead"); }
  else if(route==="services" && slug){ const c=SVC_COPY[LANG][slug]; if(c){ title=c[0]+" — Daris Cleaning"; desc=c[1]; } }
  else if(route==="about"){ title=t("nav.about")+" — Daris Cleaning"; desc=t("about.lead"); }
  else if(route==="contact"){ title=t("nav.contact")+" — Daris Cleaning"; desc=t("contact.lead"); }
  document.title=title;
  document.querySelector('meta[name=description]').setAttribute("content",desc||"");
  const canon=base+"/"+LANG+(seg==="/"?"/":seg);
  document.querySelector('link[rel=canonical]').setAttribute("href",canon);
  document.querySelectorAll('link[rel=alternate]').forEach(l=>{ const hl=l.getAttribute("hreflang");
    if(hl==="x-default"){
      const defaultSeg=route?("/"+route+(slug?"/"+slug:"")):"/";
      l.setAttribute("href",base+defaultSeg);
    }
    else if(LANGS.includes(hl)){ const alternateSeg=pathForLang(hl); l.setAttribute("href",base+"/"+hl+(alternateSeg==="/"?"/":alternateSeg)); } });
}

function renderRoute(route,slug){
  // kill previous ScrollTriggers
  stInstances.forEach(s=>s&&s.kill&&s.kill()); stInstances=[];
  if(window.ScrollTrigger) ScrollTrigger.getAll().forEach(s=>s.kill());
  const view=document.getElementById("view");
  let html="";
  if(route==="") html=viewHome();
  else if(route==="services" && !slug) html=viewServices();
  else if(route==="services" && slug && SVC_COPY[LANG][slug]) html=viewServiceDetail(slug);
  else if(route==="about") html=viewAbout();
  else if(route==="contact") html=viewContact();
  else html=viewHome();

  const doSwap=()=>{ view.innerHTML=html; window.scrollTo(0,0); afterRender(route,slug); };
  if(prefersReduce || !window.gsap){ doSwap(); }
  else {
    gsap.to(view,{opacity:0,y:12,duration:.2,ease:"power2.in",onComplete:()=>{ doSwap(); gsap.fromTo(view,{opacity:0,y:14},{opacity:1,y:0,duration:.45,ease:"power3.out"}); }});
  }
  setActiveNav(route); updateMeta(route,slug);
  closeMenu();
}

function afterRender(route,slug){
  wireImageFallbacks();
  wireAccordions();
  if(route==="") { initHomeAnimations(); }
  if(route==="contact") wireForm();
  // magnetic buttons + reveals for every view
  initReveals(); initMagnetic();
  ScrollTrigger && ScrollTrigger.refresh();
}

/* =======================================================================
   IMAGE FALLBACKS (cartoon swap)
   ======================================================================= */
function cartoonFallback(img){
  if(img.dataset.failed) return; img.dataset.failed="1";
  const sym=img.dataset.sym||"svc-home-cleaning";
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 320 240"); svg.setAttribute("role","img");
  svg.setAttribute("aria-label",img.alt||"Daris Cleaning");
  svg.style.width="100%"; svg.style.height="100%";
  const use=document.createElementNS("http://www.w3.org/2000/svg","use");
  use.setAttribute("href","#"+sym); svg.appendChild(use);
  img.replaceWith(svg);
}
window.cartoonFallback=cartoonFallback;
function cartoonFallbackRaw(img,sym){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 320 240"); svg.setAttribute("preserveAspectRatio","xMidYMid slice");
  svg.style.position="absolute"; svg.style.inset="0"; svg.style.width="100%"; svg.style.height="100%";
  const use=document.createElementNS("http://www.w3.org/2000/svg","use"); use.setAttribute("href","#"+sym); svg.appendChild(use);
  img.replaceWith(svg);
}
function wireImageFallbacks(){
  // trigger onerror for already-broken images (cached errors)
  document.querySelectorAll('#view img[data-sym]').forEach(img=>{ if(img.complete && img.naturalWidth===0) cartoonFallback(img); });
}

/* =======================================================================
   ACCORDIONS (services + FAQ), one open at a time within a group
   ======================================================================= */
function wireAccordions(){
  document.querySelectorAll('#view [data-acc]').forEach(item=>{
    const btn=item.querySelector('button');
    const panel=item.querySelector('.acc-panel,.faq-a');
    if(!btn||!panel) return;
    // set initial height
    if(item.getAttribute('aria-expanded')==='true'){ panel.style.height='auto'; }
    btn.addEventListener('click',()=>toggleAcc(item,panel));
    btn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleAcc(item,panel); } });
  });
}
function toggleAcc(item,panel){
  const group=item.parentNode;
  const open=item.getAttribute('aria-expanded')==='true';
  if(!open){
    group.querySelectorAll('[data-acc][aria-expanded="true"]').forEach(other=>{
      if(other!==item){ const op=other.querySelector('.acc-panel,.faq-a'); closeAcc(other,op); }
    });
  }
  if(open){ closeAcc(item,panel); } else { openAcc(item,panel); }
}
function openAcc(item,panel){
  item.setAttribute('aria-expanded','true'); item.querySelector('button').setAttribute('aria-expanded','true');
  const h=panel.scrollHeight;
  if(prefersReduce||!window.gsap){ panel.style.height='auto'; return; }
  gsap.fromTo(panel,{height:0},{height:h,duration:.5,ease:'power3.out',onComplete:()=>panel.style.height='auto'});
}
function closeAcc(item,panel){
  item.setAttribute('aria-expanded','false'); item.querySelector('button').setAttribute('aria-expanded','false');
  if(prefersReduce||!window.gsap){ panel.style.height=0; return; }
  gsap.fromTo(panel,{height:panel.scrollHeight},{height:0,duration:.4,ease:'power3.inOut'});
}

window.goService=goService;

/* =======================================================================
   ANIMATIONS
   ======================================================================= */
function initReveals(){
  if(prefersReduce||!window.gsap) return;
  gsap.utils.toArray('#view [data-rv]').forEach(el=>{
    const st=gsap.fromTo(el,{opacity:0,y:26},{opacity:1,y:0,duration:.8,ease:'power3.out',
      scrollTrigger:{trigger:el,start:'top 88%'}});
    if(st.scrollTrigger) stInstances.push(st.scrollTrigger);

}
function initMagnetic(){
  if(prefersReduce) return;
  document.querySelectorAll('#view [data-magnetic]').forEach(btn=>{
    btn.addEventListener('mousemove',e=>{ const r=btn.getBoundingClientRect();
      const x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
      btn.style.transform='translate('+x*0.25+'px,'+y*0.3+'px)'; });
    btn.addEventListener('mouseleave',()=>{ btn.style.transform=''; });

function initHomeAnimations(){
  // Hero headline masked slide-up
  if(!prefersReduce && window.gsap){
    gsap.fromTo('#view .hero-copy h1 .line > span',{yPercent:120},{yPercent:0,duration:1,ease:'power4.out',stagger:.12,delay:.1});
    // hero float
    gsap.to('#view .hero-float',{y:-14,duration:3,ease:'sine.inOut',yoyo:true,repeat:-1});
  }
  bubbleCanvas();
  // How it works horizontal pin (desktop only)
  const track=document.getElementById('howTrack'); const pin=document.getElementById('howPin');
  if(track && pin && window.gsap && window.ScrollTrigger && !prefersReduce && window.innerWidth>900){
    const dist=()=> track.scrollWidth - pin.clientWidth + 40;
    if(dist()>0){
      const tw=gsap.to(track,{x:()=>-dist(),ease:'none',
        scrollTrigger:{trigger:pin,start:'center center',end:()=>'+='+dist(),scrub:1,pin:true,anticipatePin:1,invalidateOnRefresh:true}});
      if(tw.scrollTrigger) stInstances.push(tw.scrollTrigger);
    }
  } else if(track){ track.style.flexWrap='wrap'; }
}
/* threeui-style subtle bubbles in hero, paused off-screen */
function bubbleCanvas(){
  const cv=document.getElementById('bubbleCanvas'); if(!cv) return;
  if(prefersReduce){ return; }
  const ctx=cv.getContext('2d'); let w,h,bubbles=[],raf=null,visible=true;
  function size(){ const r=cv.getBoundingClientRect(); w=cv.width=r.width*devicePixelRatio; h=cv.height=r.height*devicePixelRatio; }
  function mk(){ return {x:Math.random()*w,y:h+Math.random()*h,r:(6+Math.random()*22)*devicePixelRatio,s:(.2+Math.random()*.6)*devicePixelRatio,o:.08+Math.random()*.18}; }
  function init(){ size(); bubbles=Array.from({length:18},mk); }
  function draw(){ ctx.clearRect(0,0,w,h);
    bubbles.forEach(b=>{ b.y-=b.s; if(b.y+b.r<0){Object.assign(b,mk());b.y=h+b.r;}
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.strokeStyle='rgba(92,200,192,'+b.o+')'; ctx.lineWidth=1.3*devicePixelRatio; ctx.stroke();
      ctx.fillStyle='rgba(92,200,192,'+(b.o*0.4)+')'; ctx.fill(); });
    raf=requestAnimationFrame(draw); }
  init();
  const io=new IntersectionObserver(es=>{ es.forEach(e=>{ visible=e.isIntersecting;
    if(visible && !raf){ draw(); } else if(!visible && raf){ cancelAnimationFrame(raf); raf=null; } }); });
  io.observe(cv);
  addEventListener('resize',()=>{ init(); });
}
/* =======================================================================
   FORM
   ======================================================================= */
function wireForm(){
  const form=document.getElementById('contactForm'); if(!form) return;
  const copyBtn=document.getElementById('copyEmail');
  if(copyBtn) copyBtn.addEventListener('click',()=>{ navigator.clipboard.writeText(CONFIG.email).then(()=>{ copyBtn.textContent=i18n[LANG].contact.copied; setTimeout(()=>copyBtn.textContent=i18n[LANG].contact.copy,1600); }); });
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const f=i18n[LANG].contact.form;
    const data=Object.fromEntries(new FormData(form).entries());
    // clear errors
    form.querySelectorAll('.err').forEach(s=>s.textContent='');
    let ok=true;
    if(!data.name||!data.name.trim()){ setErr(form,'name',f.err.name); ok=false; }
    if(!data.email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)){ setErr(form,'email',f.err.email); ok=false; }
    if(!data.message||!data.message.trim()){ setErr(form,'message',f.err.message); ok=false; }
    if(data.company){ /* honeypot filled -> silently succeed */ showOk(form); return; }
    if(!ok){ const first=form.querySelector('.err:not(:empty)'); if(first) first.previousElementSibling?.focus?.(); return; }
    const btn=document.getElementById('cfSubmit'); const prev=btn.innerHTML; btn.disabled=true; btn.textContent='…';
    try{
      const res=await fetch(CONFIG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      if(!res.ok) throw new Error('bad');
      showOk(form);
    }catch(err){ setErr(form,'message',f.err.fail); btn.disabled=false; btn.innerHTML=prev; }
  });
}
function setErr(form,name,msg){ const el=form.querySelector('[data-err="'+name+'"]'); if(el) el.textContent=msg; }
function showOk(form){ form.style.display='none'; const ok=document.getElementById('formOk'); if(ok){ ok.style.display='block'; if(window.gsap&&!prefersReduce) gsap.fromTo(ok,{opacity:0,y:16},{opacity:1,y:0,duration:.5,ease:'power3.out'}); } }

/* =======================================================================
   HEADER hide/show + scrolled, MENU, CURSOR, COOKIE
   ======================================================================= */
const header=document.getElementById('siteHeader'); let lastY=0;
addEventListener('scroll',()=>{ const y=scrollY;
  header.classList.toggle('scrolled',y>10);
  if(y>lastY && y>200){ header.classList.add('hide'); } else { header.classList.remove('hide'); }
  lastY=y;
},{passive:true});

const burger=document.getElementById('burger'), overlay=document.getElementById('menuOverlay');
function openMenu(){ overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false'); burger.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; }
function closeMenu(){ overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); burger.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
burger.addEventListener('click',()=> overlay.classList.contains('open')?closeMenu():openMenu());

// custom cursor (desktop pointer only)
if(matchMedia('(hover:hover) and (pointer:fine)').matches && !prefersReduce){
  const cur=document.querySelector('.cursor');
  addEventListener('mousemove',e=>{ cur.style.opacity='1'; gsap?gsap.to(cur,{x:e.clientX,y:e.clientY,duration:.25,ease:'power2.out'}):cur.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'; });
  document.addEventListener('mouseover',e=>{ if(e.target.closest('a,button,[data-magnetic],input,select,textarea')) cur.classList.add('hover'); });
  document.addEventListener('mouseout',e=>{ if(e.target.closest('a,button,[data-magnetic],input,select,textarea')) cur.classList.remove('hover'); });
}

// cookie notice
(function cookie(){ let seen; try{seen=localStorage.getItem('daris-cookie');}catch(e){}
  const el=document.getElementById('cookie'); if(!seen){ setTimeout(()=>el.classList.add('show'),1200); }
  function dismiss(){ el.classList.remove('show'); try{localStorage.setItem('daris-cookie','1');}catch(e){} }
  document.getElementById('cookieOk').addEventListener('click',dismiss);
  document.getElementById('cookieNo').addEventListener('click',dismiss);
})();

/* =======================================================================
   GLOBAL LINK INTERCEPTION + BOOT
   ======================================================================= */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-link]'); if(!a) return;
  if(a.getAttribute('onclick')) return; // handled elsewhere (goService)
  e.preventDefault(); const route=a.dataset.route||''; navigate("/"+LANG+"/"+route);
});
addEventListener('popstate',()=>{ const {lang,route,slug}=parsePath(); if(lang)setLangQuiet(lang); renderRoute(route,slug); setActiveNav(route); updateMeta(route,slug); });
if(USE_HASH) addEventListener('hashchange',()=>{ const {lang,route,slug}=parsePath(); if(lang)setLangQuiet(lang); renderRoute(route,slug); setActiveNav(route); updateMeta(route,slug); });

function boot(){
  applyThemeIcon();
  // language: URL > saved > browser > fi
  let saved; try{saved=localStorage.getItem('daris-lang');}catch(e){}
  const {lang,route,slug}=parsePath();
  let initial = LANGS.includes(lang)?lang : (saved||(navigator.language||'fi').slice(0,2));
  if(!LANGS.includes(initial)) initial='fi';
  LANG=initial; document.documentElement.lang=initial;
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("active",b.dataset.lang===initial));
  applyStaticI18n(); buildFooterChrome();
  // normalise URL to include lang prefix
  const norm=buildPath(route,slug);
  if(USE_HASH){ if((location.hash||'')!=='#'+norm) location.hash=norm; }
  else { history.replaceState({},"",norm); }
  // logo load animation
  if(!prefersReduce && window.gsap){
    gsap.set('.logo-stroke',{strokeDasharray:100,strokeDashoffset:100});
    gsap.to('.logo-stroke',{strokeDashoffset:0,duration:1.1,ease:'power2.inOut'});
    gsap.fromTo('.logo-spark',{opacity:0,scale:0,transformOrigin:'center'},{opacity:1,scale:1,duration:.4,delay:1.1,ease:'back.out(3)'});
  }
  renderRoute(route,slug); setActiveNav(route); updateMeta(route,slug);
}
if(window.gsap && window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);
boot();
